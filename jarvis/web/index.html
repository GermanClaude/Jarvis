<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#05090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JARVIS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #05090f; --panel: #0b1420; --panel2: #102033; --line: #1b3550;
  --text: #dcecff; --muted: #7c95ad; --accent: #4fd1ff; --accent2: #ffb347;
  --ok: #5be49b; --err: #ff6b6b; --radius: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  background: radial-gradient(ellipse at top, #0c2236 0%, var(--bg) 60%); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: rgba(5,9,15,.7); backdrop-filter: blur(8px); }
.reactor { width: 34px; height: 34px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, #fff 0 14%, var(--accent) 30%, #0e4d6e 62%, transparent 70%);
  box-shadow: 0 0 18px var(--accent); transition: box-shadow .3s; }
.reactor.busy { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 36px var(--accent), 0 0 8px #fff; transform: scale(1.08); } }
header h1 { margin: 0; font-size: 18px; letter-spacing: .3em; font-weight: 600; }
header .sub { font-size: 12px; color: var(--muted); }
header .grow { flex: 1; min-width: 0; }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 10px; width: 40px; height: 40px;
  display: grid; place-items: center; flex: none; }
.icon-btn.on { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(79,209,255,.3); }
main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; display: none; flex-direction: column; }
.view.active { display: flex; }
.scroll { flex: 1; overflow-y: auto; padding: 16px; overscroll-behavior: contain; }
nav { display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding-bottom: var(--safe-b); }
nav button { flex: 1; background: none; border: 0; padding: 8px 0 10px; color: var(--muted);
  font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button svg { width: 22px; height: 22px; }
nav button.active { color: var(--accent); }

/* Chat */
.msg { max-width: 92%; margin: 0 0 14px; padding: 10px 14px; border-radius: var(--radius);
  overflow-wrap: anywhere; }
.msg.user { margin-left: auto; background: var(--panel2); border: 1px solid var(--line); white-space: pre-wrap; }
.msg.bot { background: rgba(11,20,32,.8); border: 1px solid rgba(79,209,255,.18); }
.msg.bot p { margin: .4em 0; }
.msg.bot :first-child { margin-top: 0; } .msg.bot :last-child { margin-bottom: 0; }
.msg pre { background: #02060b; border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  overflow-x: auto; font-size: 13px; position: relative; }
.msg code { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: .9em; }
.msg :not(pre) > code { background: #02060b; padding: 1px 5px; border-radius: 5px; }
.msg a { color: var(--accent); }
.msg h1, .msg h2, .msg h3 { font-size: 1.05em; margin: .8em 0 .3em; color: var(--accent); }
.msg ul, .msg ol { padding-left: 1.3em; margin: .4em 0; }
.msg table { border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; }
.msg td, .msg th { border: 1px solid var(--line); padding: 4px 8px; }
.copy { position: absolute; top: 6px; right: 6px; font-size: 11px; background: var(--panel2);
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin: 2px 4px 6px 0; }
.chip.ok { color: var(--ok); border-color: rgba(91,228,155,.35); }
.chip.err { color: var(--err); border-color: rgba(255,107,107,.35); }
.chip.run::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent2);
  animation: pulse 1s infinite; }
details.think { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
details.think summary { cursor: pointer; }
details.think div { white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 8px; margin-top: 4px; }
.error { color: var(--err); font-size: 14px; }
.empty { text-align: center; color: var(--muted); margin-top: 18vh; padding: 0 24px; }
.empty .reactor { width: 90px; height: 90px; margin: 0 auto 18px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.suggest button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px;
  border-top: 1px solid var(--line); background: var(--panel); }
.composer textarea { flex: 1; resize: none; max-height: 40vh; min-height: 44px; padding: 10px 12px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; outline: none; }
.composer textarea:focus { border-color: var(--accent); }
.send { background: var(--accent); color: #00131f; border: 0; border-radius: 12px; width: 44px; height: 44px;
  display: grid; place-items: center; flex: none; font-weight: 700; }
.send:disabled { opacity: .4; }
.mic.listening { background: var(--err); border-color: var(--err); color: #fff; animation: pulse 1s infinite; }
.thumbs { display: flex; gap: 6px; padding: 0 12px; background: var(--panel); }
.thumbs img { height: 54px; border-radius: 8px; border: 1px solid var(--line); margin-top: 8px; }

/* Listen & Editor */
.toolbar { display: flex; gap: 8px; padding: 12px 16px 0; align-items: center; flex-wrap: wrap; }
.toolbar input, .toolbar select, .field { flex: 1; min-width: 0; padding: 9px 12px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; outline: none; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.btn.primary { background: var(--accent); color: #00131f; border-color: var(--accent); font-weight: 600; }
.item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin-bottom: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.item .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item small { color: var(--muted); display: block; }
.item.link { cursor: pointer; }
.del { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 0 4px; }
h2.cat { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin: 16px 0 8px; }
.editor { flex: 1; display: none; flex-direction: column; padding: 12px 16px; gap: 8px; min-height: 0; }
.editor.open { display: flex; }
.editor textarea { flex: 1; width: 100%; resize: none; padding: 12px; background: #02060b; border: 1px solid var(--line);
  border-radius: 12px; font: 13px/1.5 ui-monospace, Menlo, monospace; outline: none; white-space: pre; }
#factInput { flex-basis: 100%; }
.editor .toolbar { flex-wrap: nowrap; }
.path { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.drawer { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 10; }
.drawer.open { display: block; }
.drawer .panel { position: absolute; top: 0; bottom: 0; left: 0; width: min(84vw, 360px); background: var(--panel);
  border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.check { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin-top: 2px; }
.done .grow { text-decoration: line-through; color: var(--muted); }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="menuBtn" aria-label="Gespräche">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="reactor" id="reactor"></div>
  <div class="grow"><h1>JARVIS</h1><div class="sub" id="statusLine">verbinde …</div></div>
  <button class="icon-btn" id="speakBtn" aria-label="Antworten vorlesen" title="Antworten vorlesen">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
  </button>
</header>

<main>
  <!-- Chat -->
  <section class="view active" id="view-chat">
    <div class="scroll" id="chat"></div>
    <div class="thumbs" id="thumbs"></div>
    <form class="composer" id="composer">
      <input type="file" id="imageInput" accept="image/*" multiple hidden>
      <button type="button" class="icon-btn" id="attachBtn" aria-label="Bild anhängen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 12-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.9-2.9L15 7"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Frag Jarvis …" enterkeyhint="send"></textarea>
      <button type="button" class="icon-btn mic" id="micBtn" aria-label="Sprechen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
      </button>
      <button type="submit" class="send" id="sendBtn" aria-label="Senden">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5l2.5 8.5L3 20.5zm2.5-8.5h8"/></svg>
      </button>
    </form>
  </section>

  <!-- Gedächtnis -->
  <section class="view" id="view-memory">
    <div class="toolbar">
      <input id="factInput" placeholder="Etwas über dich, das Jarvis wissen soll …">
      <select id="factCat"></select>
      <button class="btn primary" id="factAdd">Merken</button>
    </div>
    <div class="scroll" id="facts"></div>
  </section>

  <!-- Notizen -->
  <section class="view" id="view-notes">
    <div class="toolbar">
      <input id="noteFilter" placeholder="Notizen durchsuchen …">
      <button class="btn primary" id="noteNew">Neu</button>
    </div>
    <div class="scroll" id="notes"></div>
    <div class="editor" id="noteEditor">
      <input class="field" id="noteTitle" placeholder="Titel">
      <textarea id="noteBody" spellcheck="true"></textarea>
      <div class="toolbar" style="padding:0">
        <button class="btn" id="noteClose">Zurück</button>
        <button class="btn" id="noteDelete">Löschen</button>
        <span class="grow" style="flex:1"></span>
        <button class="btn primary" id="noteSave">Speichern</button>
      </div>
    </div>
  </section>

  <!-- Aufgaben -->
  <section class="view" id="view-tasks">
    <div class="toolbar">
      <input id="taskInput" placeholder="Neue Aufgabe …">
      <input id="taskDue" type="date" style="flex:0 0 150px">
      <button class="btn primary" id="taskAdd">+</button>
    </div>
    <div class="scroll" id="tasks"></div>
  </section>

  <!-- Dateien -->
  <section class="view" id="view-files">
    <div class="toolbar">
      <button class="btn" id="fileUp">↑</button>
      <div class="path grow" id="filePath" style="flex:1"></div>
      <button class="btn" id="fileNew">Neue Datei</button>
    </div>
    <div class="scroll" id="files"></div>
    <div class="editor" id="fileEditor">
      <div class="path" id="fileName"></div>
      <textarea id="fileBody" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <div class="toolbar" style="padding:0">
        <button class="btn" id="fileClose">Zurück</button>
        <button class="btn" id="fileAsk">Jarvis fragen</button>
        <span style="flex:1"></span>
        <button class="btn primary" id="fileSave">Speichern</button>
      </div>
    </div>
  </section>
</main>

<nav id="nav">
  <button data-view="chat" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chat</button>
  <button data-view="memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3a4 4 0 0 0-4 4 4 4 0 0 0-1 7 4 4 0 0 0 5 6V3zm6 0a4 4 0 0 1 4 4 4 4 0 0 1 1 7 4 4 0 0 1-5 6V3z"/></svg>Gedächtnis</button>
  <button data-view="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></svg>Notizen</button>
  <button data-view="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11 3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Aufgaben</button>
  <button data-view="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Dateien</button>
</nav>

<div class="drawer" id="drawer">
  <div class="panel">
    <div class="toolbar" style="padding:16px">
      <strong style="flex:1">Gespräche</strong>
      <button class="btn primary" id="newChat">+ Neu</button>
    </div>
    <div class="scroll" id="convs"></div>
  </div>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const CATS = ["identitaet","vorliebe","ziel","projekt","person","gewohnheit","denkweise","kommunikation","wissen","sonstiges"];
const CAT_LABEL = {identitaet:"Identität",vorliebe:"Vorlieben",ziel:"Ziele",projekt:"Projekte",person:"Menschen",
  gewohnheit:"Gewohnheiten",denkweise:"Denkweise",kommunikation:"Kommunikation",wissen:"Wissen",sonstiges:"Sonstiges"};
const TOOL_LABEL = {remember:"merkt sich etwas",update_memory:"aktualisiert Erinnerung",forget:"vergisst",
  search_brain:"durchsucht Gedächtnis",save_note:"schreibt Notiz",read_note:"liest Notiz",list_notes:"Notizen",
  add_task:"neue Aufgabe",list_tasks:"Aufgaben",complete_task:"erledigt Aufgabe",list_dir:"Ordner",
  read_file:"liest Datei",write_file:"schreibt Datei",edit_file:"bearbeitet Datei",move_path:"verschiebt",
  delete_path:"löscht",find_files:"sucht Dateien",run_python:"führt Python aus",run_shell:"Shell",
  open:"öffnet",list_apps:"Apps",phone:"Handy",web_search:"sucht im Web",web_fetch:"liest Webseite"};

const store = {
  get(k, d) { try { const v = localStorage.getItem("jarvis." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("jarvis." + k, JSON.stringify(v)); } catch {} },
};
let token = store.get("token", "");
let convId = store.get("conv", null);
let speakOn = store.get("speak", false);
let busy = false;
let pendingImages = [];

// ---------------------------------------------------------------- API
async function api(path, opts = {}) {
  const headers = {"Content-Type": "application/json", ...(token ? {Authorization: "Bearer " + token} : {})};
  const res = await fetch(path, {...opts, headers: {...headers, ...(opts.headers || {})}});
  if (res.status === 401) {
    token = prompt("Zugangscode für Jarvis:") || "";
    store.set("token", token);
    if (token) return api(path, opts);
  }
  const data = res.headers.get("content-type")?.includes("json") ? await res.json() : null;
  if (!res.ok) throw new Error(data?.error || res.statusText);
  return data;
}

// ---------------------------------------------------------------- Markdown (sicher: erst escapen)
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(src) {
  const out = []; const lines = src.split("\n"); let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^```(\w*)/);
    if (fence) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++;
      out.push(`<pre><button class="copy">kopieren</button><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push(`<h3>${inline(esc(h[2]))}</h3>`); i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d/.test(line); const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i]))
        items.push(`<li>${inline(esc(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, "")))}</li>`);
      out.push(`<${ordered ? "ol" : "ul"}>${items.join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (/^\|.*\|\s*$/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i++].trim().slice(1, -1).split("|");
        if (cells.every((c) => /^\s*:?-+:?\s*$/.test(c))) continue;
        rows.push(`<tr>${cells.map((c) => `<td>${inline(esc(c.trim()))}</td>`).join("")}</tr>`);
      }
      out.push(`<table>${rows.join("")}</table>`);
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*([-*•]|\d+[.)])\s+|\|)/.test(lines[i])) para.push(lines[i++]);
    if (!para.length) para.push(lines[i++]);
    out.push(`<p>${para.map((l) => inline(esc(l))).join("<br>")}</p>`);
  }
  return out.join("");
}
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("copy")) {
    navigator.clipboard?.writeText(e.target.nextElementSibling.textContent);
    e.target.textContent = "✓"; setTimeout(() => (e.target.textContent = "kopieren"), 1200);
  }
});

// ---------------------------------------------------------------- Chat
const chatEl = $("#chat");
function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }
function setBusy(b) { busy = b; $("#reactor").classList.toggle("busy", b); $("#sendBtn").disabled = b; }

function emptyState() {
  chatEl.innerHTML = `<div class="empty"><div class="reactor"></div>
    <div>Guten ${new Date().getHours() < 12 ? "Morgen" : new Date().getHours() < 18 ? "Tag" : "Abend"}. Wie kann ich helfen?</div>
    <div class="suggest">
      <button>Erzähl mir, was du über mich weißt</button>
      <button>Was steht heute an?</button>
      <button>Schreib mir ein Python-Skript, das meine Downloads sortiert</button>
      <button>Lass uns ein Kennenlern-Interview machen, damit du mich besser verstehst</button>
    </div></div>`;
  chatEl.querySelectorAll(".suggest button").forEach((b) => (b.onclick = () => send(b.textContent)));
}

function addUser(text, images = []) {
  chatEl.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg user"; el.textContent = text;
  images.forEach((img) => { const i = document.createElement("img"); i.src = `data:${img.media_type};base64,${img.data}`;
    i.style.cssText = "max-width:100%;border-radius:8px;display:block;margin-top:6px"; el.appendChild(i); });
  chatEl.appendChild(el); scrollDown();
}

function botBubble() {
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = `<div class="tools"></div><div class="body"></div>`;
  chatEl.appendChild(el);
  return el;
}

function toolChip(container, name, state = "run", id = "") {
  const chip = document.createElement("span");
  chip.className = "chip " + state; chip.dataset.id = id;
  chip.textContent = TOOL_LABEL[name] || name;
  container.appendChild(chip);
  return chip;
}

function textOf(content) {
  if (typeof content === "string") return content;
  return content.filter((b) => b.type === "text" && !b.text.startsWith("<kontext>")).map((b) => b.text).join("\n");
}

async function loadConversation(id) {
  convId = id; store.set("conv", id);
  if (!id) return emptyState();
  let conv;
  try { conv = await api(`/api/conversations/${id}`); } catch { convId = null; store.set("conv", null); return emptyState(); }
  chatEl.innerHTML = "";
  let bubble = null;
  for (const m of conv.messages) {
    const isToolResult = Array.isArray(m.content) && m.content.some((b) => b.type === "tool_result");
    if (m.role === "user" && !isToolResult) { bubble = null; addUser(textOf(m.content)); continue; }
    if (m.role === "user") {
      for (const b of m.content) if (b.type === "tool_result" && b.is_error)
        bubble?.querySelector(`.chip[data-id="${b.tool_use_id}"]`)?.classList.replace("ok", "err");
      continue;
    }
    if (!bubble) bubble = botBubble();
    for (const b of m.content) {
      if (b.type === "tool_use" || b.type === "server_tool_use") toolChip(bubble.querySelector(".tools"), b.name, "ok", b.id);
      if (b.type === "text") {
        const body = bubble.querySelector(".body");
        body.dataset.raw = (body.dataset.raw ? body.dataset.raw + "\n\n" : "") + b.text;
        body.innerHTML = md(body.dataset.raw);
      }
    }
  }
  scrollDown();
}

async function send(text, voice = false) {
  text = (text ?? $("#input").value).trim();
  if (busy || (!text && !pendingImages.length)) return;
  const images = pendingImages; pendingImages = []; $("#thumbs").innerHTML = "";
  $("#input").value = ""; autosize();
  addUser(text, images);
  setBusy(true);
  const bubble = botBubble();
  const tools = bubble.querySelector(".tools"), body = bubble.querySelector(".body");
  let raw = "", thinking = null, spoken = "";
  const chips = {};
  const render = () => { body.innerHTML = md(raw); scrollDown(); };

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json", ...(token ? {Authorization: "Bearer " + token} : {})},
      body: JSON.stringify({message: text, conversation_id: convId, images}),
    });
    if (res.status === 401) { token = prompt("Zugangscode für Jarvis:") || ""; store.set("token", token); throw new Error("Bitte erneut senden."); }
    if (!res.ok || !res.body) { const d = await res.json().catch(() => ({})); throw new Error(d.error || res.statusText); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const ev = /^event: (.*)$/m.exec(chunk)?.[1]; const dataLine = /^data: (.*)$/m.exec(chunk)?.[1];
        if (!ev || !dataLine) continue;
        const d = JSON.parse(dataLine);
        if (ev === "meta") { convId = d.conversation_id; store.set("conv", convId); }
        else if (ev === "thinking") {
          if (!thinking) { thinking = document.createElement("details"); thinking.className = "think";
            thinking.innerHTML = "<summary>Gedankengang</summary><div></div>"; bubble.insertBefore(thinking, tools); }
          thinking.querySelector("div").textContent += d.delta;
        }
        else if (ev === "text") { raw += d.delta; render(); }
        else if (ev === "tool") { if (raw && !raw.endsWith("\n\n")) raw += "\n\n"; chips[d.id] = toolChip(tools, d.name, "run", d.id); scrollDown(); }
        else if (ev === "tool_input" && d.name === "web_search" && chips[d.id]) chips[d.id].textContent = "sucht: " + (d.input?.query || "");
        else if (ev === "tool_result") { const c = chips[d.id]; if (c) { c.className = "chip " + (d.ok ? "ok" : "err"); c.title = d.preview; } }
        else if (ev === "error") { const e = document.createElement("div"); e.className = "error"; e.textContent = d.message; bubble.appendChild(e); }
      }
    }
    // Server-Tools (Websuche) melden kein eigenes Ergebnis – laufende Chips abschließen.
    Object.values(chips).forEach((c) => c.classList.contains("run") && c.classList.replace("run", "ok"));
    if ((speakOn || voice) && raw) speak(raw);
  } catch (err) {
    const e = document.createElement("div"); e.className = "error"; e.textContent = err.message; bubble.appendChild(e);
  } finally {
    setBusy(false); refreshStatus();
  }
}

// ---------------------------------------------------------------- Stimme
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  const clean = text.replace(/```[\s\S]*?```/g, " Code-Block. ").replace(/[*#`|>_]/g, "").slice(0, 3000);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "de-DE"; u.rate = 1.05;
  const voice = speechSynthesis.getVoices().find((v) => v.lang.startsWith("de") && /male|männ|Google/i.test(v.name));
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}
$("#speakBtn").classList.toggle("on", speakOn);
$("#speakBtn").onclick = () => { speakOn = !speakOn; store.set("speak", speakOn); $("#speakBtn").classList.toggle("on", speakOn); if (!speakOn) speechSynthesis?.cancel(); };

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
$("#micBtn").onclick = () => {
  if (!Recognition) { alert("Spracheingabe wird von diesem Browser nicht unterstützt (Chrome nutzen)."); return; }
  if (recog) { recog.stop(); return; }
  recog = new Recognition();
  recog.lang = "de-DE"; recog.interimResults = true; recog.continuous = false;
  const base = $("#input").value;
  recog.onresult = (e) => {
    const t = Array.from(e.results).map((r) => r[0].transcript).join("");
    $("#input").value = (base ? base + " " : "") + t; autosize();
  };
  recog.onend = () => {
    $("#micBtn").classList.remove("listening"); recog = null;
    if ($("#input").value.trim()) send(undefined, true);  // per Stimme gefragt → Antwort vorlesen
  };
  recog.onerror = () => recog?.stop();
  $("#micBtn").classList.add("listening");
  recog.start();
};

// ---------------------------------------------------------------- Bilder
$("#attachBtn").onclick = () => $("#imageInput").click();
$("#imageInput").onchange = async (e) => {
  for (const file of e.target.files) {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = bmp.width * scale; c.height = bmp.height * scale;
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", 0.85);
    pendingImages.push({media_type: "image/jpeg", data: url.split(",")[1]});
    const img = document.createElement("img"); img.src = url; $("#thumbs").appendChild(img);
  }
  e.target.value = "";
};

// ---------------------------------------------------------------- Eingabe
function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, innerHeight * 0.4) + "px"; }
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !("ontouchstart" in window)) { e.preventDefault(); send(); }
});
$("#composer").onsubmit = (e) => { e.preventDefault(); send(); };

// ---------------------------------------------------------------- Gespräche
$("#menuBtn").onclick = async () => {
  const list = await api("/api/conversations");
  $("#convs").innerHTML = "";
  for (const c of list) {
    const el = document.createElement("div"); el.className = "item link";
    el.innerHTML = `<div class="grow"></div><button class="del" title="Löschen">×</button>`;
    el.querySelector(".grow").textContent = c.title;
    const small = document.createElement("small"); small.textContent = new Date(c.updated * 1000).toLocaleString("de-DE");
    el.querySelector(".grow").appendChild(small);
    el.onclick = () => { $("#drawer").classList.remove("open"); showView("chat"); loadConversation(c.id); };
    el.querySelector(".del").onclick = async (e) => { e.stopPropagation(); if (!confirm("Gespräch löschen?")) return;
      await api(`/api/conversations/${c.id}`, {method: "DELETE"}); el.remove(); if (c.id === convId) loadConversation(null); };
    $("#convs").appendChild(el);
  }
  if (!list.length) $("#convs").innerHTML = '<p class="path">Noch keine Gespräche.</p>';
  $("#drawer").classList.add("open");
};
$("#drawer").onclick = (e) => { if (e.target.id === "drawer") $("#drawer").classList.remove("open"); };
$("#newChat").onclick = async () => {
  if (convId) api(`/api/conversations/${convId}/reflect`, {method: "POST"}).catch(() => {});
  $("#drawer").classList.remove("open"); showView("chat"); loadConversation(null);
};

// ---------------------------------------------------------------- Navigation
function showView(name) {
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === "view-" + name));
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === name));
  ({memory: loadFacts, notes: loadNotes, tasks: loadTasks, files: () => loadFiles(store.get("dir", "."))})[name]?.();
}
$("#nav").onclick = (e) => { const b = e.target.closest("button"); if (b) showView(b.dataset.view); };

// ---------------------------------------------------------------- Gedächtnis
$("#factCat").innerHTML = CATS.map((c) => `<option value="${c}">${CAT_LABEL[c]}</option>`).join("");
async function loadFacts() {
  const facts = await api("/api/facts");
  const el = $("#facts"); el.innerHTML = "";
  if (!facts.length) { el.innerHTML = '<p class="empty">Jarvis kennt dich noch nicht. Erzähl ihm im Chat von dir – er merkt sich alles Wichtige automatisch.</p>'; return; }
  for (const cat of CATS) {
    const group = facts.filter((f) => f.category === cat);
    if (!group.length) continue;
    const h = document.createElement("h2"); h.className = "cat"; h.textContent = CAT_LABEL[cat]; el.appendChild(h);
    for (const f of group) {
      const row = document.createElement("div"); row.className = "item";
      row.innerHTML = `<div class="grow" contenteditable="true"></div><button class="del">×</button>`;
      const text = row.querySelector(".grow"); text.textContent = f.content;
      text.onblur = () => { if (text.textContent.trim() !== f.content) api(`/api/facts/${f.id}`, {method: "PUT", body: JSON.stringify({content: text.textContent.trim()})}); };
      row.querySelector(".del").onclick = async () => { await api(`/api/facts/${f.id}`, {method: "DELETE"}); row.remove(); };
      el.appendChild(row);
    }
  }
}
$("#factAdd").onclick = async () => {
  const content = $("#factInput").value.trim(); if (!content) return;
  await api("/api/facts", {method: "POST", body: JSON.stringify({content, category: $("#factCat").value})});
  $("#factInput").value = ""; loadFacts();
};

// ---------------------------------------------------------------- Notizen
let notesCache = [], currentNote = null;
async function loadNotes() { notesCache = await api("/api/notes"); renderNotes(); }
function renderNotes() {
  const q = $("#noteFilter").value.toLowerCase();
  const el = $("#notes"); el.innerHTML = "";
  for (const n of notesCache.filter((n) => n.title.toLowerCase().includes(q))) {
    const row = document.createElement("div"); row.className = "item link";
    row.innerHTML = `<div class="grow"></div>`;
    row.firstChild.textContent = n.title;
    const s = document.createElement("small"); s.textContent = new Date(n.modified * 1000).toLocaleString("de-DE"); row.firstChild.appendChild(s);
    row.onclick = () => openNote(n.title);
    el.appendChild(row);
  }
  if (!el.children.length) el.innerHTML = '<p class="empty">Keine Notizen. Sag Jarvis z. B. „Notiere meine Idee: …“</p>';
}
function noteEditor(open) { $("#noteEditor").classList.toggle("open", open); $("#notes").style.display = open ? "none" : ""; }
async function openNote(title) {
  const n = await api(`/api/notes/${encodeURIComponent(title)}`);
  currentNote = title; $("#noteTitle").value = title; $("#noteBody").value = n.content; noteEditor(true);
}
$("#noteFilter").oninput = renderNotes;
$("#noteNew").onclick = () => { currentNote = null; $("#noteTitle").value = ""; $("#noteBody").value = ""; noteEditor(true); $("#noteTitle").focus(); };
$("#noteClose").onclick = () => { noteEditor(false); loadNotes(); };
$("#noteSave").onclick = async () => {
  const title = $("#noteTitle").value.trim(); if (!title) return alert("Titel fehlt");
  await api(`/api/notes/${encodeURIComponent(title)}`, {method: "PUT", body: JSON.stringify({content: $("#noteBody").value})});
  if (currentNote && currentNote !== title) await api(`/api/notes/${encodeURIComponent(currentNote)}`, {method: "DELETE"});
  currentNote = title; $("#noteSave").textContent = "✓ Gespeichert"; setTimeout(() => ($("#noteSave").textContent = "Speichern"), 1200);
};
$("#noteDelete").onclick = async () => {
  if (!currentNote || !confirm("Notiz löschen?")) return;
  await api(`/api/notes/${encodeURIComponent(currentNote)}`, {method: "DELETE"}); noteEditor(false); loadNotes();
};

// ---------------------------------------------------------------- Aufgaben
async function loadTasks() {
  const tasks = await api("/api/tasks?all=1");
  const el = $("#tasks"); el.innerHTML = "";
  for (const t of tasks) {
    const row = document.createElement("div"); row.className = "item" + (t.done ? " done" : "");
    row.innerHTML = `<input type="checkbox" class="check" ${t.done ? "checked disabled" : ""}><div class="grow"></div><button class="del">×</button>`;
    row.querySelector(".grow").textContent = t.title;
    if (t.due || t.notes) { const s = document.createElement("small"); s.textContent = [t.due && "fällig " + t.due, t.notes].filter(Boolean).join(" · "); row.querySelector(".grow").appendChild(s); }
    row.querySelector(".check").onchange = async () => { await api(`/api/tasks/${t.id}/done`, {method: "POST"}); loadTasks(); };
    row.querySelector(".del").onclick = async () => { await api(`/api/tasks/${t.id}`, {method: "DELETE"}); row.remove(); };
    el.appendChild(row);
  }
  if (!tasks.length) el.innerHTML = '<p class="empty">Keine Aufgaben. Sag z. B. „Erinnere mich morgen an den Zahnarzt“.</p>';
}
$("#taskAdd").onclick = async () => {
  const title = $("#taskInput").value.trim(); if (!title) return;
  await api("/api/tasks", {method: "POST", body: JSON.stringify({title, due: $("#taskDue").value || null})});
  $("#taskInput").value = ""; $("#taskDue").value = ""; loadTasks();
};
$("#taskInput").onkeydown = (e) => { if (e.key === "Enter") $("#taskAdd").click(); };

// ---------------------------------------------------------------- Dateien
let dir = null, openFile = null;
function fileEditor(open) { $("#fileEditor").classList.toggle("open", open); $("#files").style.display = open ? "none" : ""; }
async function loadFiles(path) {
  let data;
  try { data = await api(`/api/files?path=${encodeURIComponent(path)}`); }
  catch (e) { if (path !== ".") return loadFiles("."); $("#files").textContent = e.message; return; }
  dir = data; store.set("dir", data.path); $("#filePath").textContent = data.path;
  const el = $("#files"); el.innerHTML = "";
  for (const f of data.entries) {
    const row = document.createElement("div"); row.className = "item link";
    row.innerHTML = `<span>${f.dir ? "📁" : "📄"}</span><div class="grow"></div>`;
    row.querySelector(".grow").textContent = f.name;
    if (!f.dir) { const s = document.createElement("small"); s.textContent = f.size < 1024 ? f.size + " B" : (f.size / 1024).toFixed(1) + " KB"; row.querySelector(".grow").appendChild(s); }
    row.onclick = () => f.dir ? loadFiles(data.path + "/" + f.name) : editFile(data.path + "/" + f.name);
    el.appendChild(row);
  }
}
async function editFile(path) {
  try { const f = await api(`/api/file?path=${encodeURIComponent(path)}`); openFile = f.path;
    $("#fileName").textContent = f.path; $("#fileBody").value = f.content; fileEditor(true); }
  catch (e) { alert(e.message); }
}
$("#fileUp").onclick = () => dir && loadFiles(dir.parent);
$("#fileClose").onclick = () => { fileEditor(false); loadFiles(dir.path); };
$("#fileNew").onclick = () => { const name = prompt("Dateiname:"); if (!name) return;
  openFile = dir.path + "/" + name; $("#fileName").textContent = openFile; $("#fileBody").value = ""; fileEditor(true); };
$("#fileSave").onclick = async () => {
  await api("/api/file", {method: "PUT", body: JSON.stringify({path: openFile, content: $("#fileBody").value})});
  $("#fileSave").textContent = "✓ Gespeichert"; setTimeout(() => ($("#fileSave").textContent = "Speichern"), 1200);
};
$("#fileAsk").onclick = () => { showView("chat"); $("#input").value = `Schau dir die Datei ${openFile} an und `; autosize(); $("#input").focus(); };
$("#fileBody").addEventListener("keydown", (e) => {
  if (e.key === "Tab") { e.preventDefault(); const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + "    " + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 4; }
});

// ---------------------------------------------------------------- Start
async function refreshStatus() {
  try { const s = await api("/api/status");
    $("#statusLine").textContent = `online · ${s.facts} Erinnerungen · ${s.notes} Notizen · ${s.tasks} Aufgaben`; }
  catch { $("#statusLine").textContent = "offline"; }
}
refreshStatus();
loadConversation(convId);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
